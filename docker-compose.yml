name: genai-platform-lab
services:
  db:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_DB: gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run init_env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U gateway -d gateway]
      interval: 3s
      timeout: 3s
      retries: 30
  mock:
    build: .
    command: [uvicorn, mock_provider.main:app, --host, 0.0.0.0, --port, "8001", --no-access-log]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
  gateway:
    image: ghcr.io/berriai/litellm:v1.100.2
    command: [--config, /config/config.yaml, --port, "4000"]
    environment:
      DATABASE_URL: postgresql://gateway:${POSTGRES_PASSWORD}@db:5432/gateway
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      STORE_MODEL_IN_DB: "False"
      LITELLM_LOG: ERROR
    volumes: [./litellm/config.yaml:/config/config.yaml:ro]
    ports: ["127.0.0.1:4000:4000"]
    extra_hosts: [host.docker.internal:host-gateway]
    depends_on:
      db: {condition: service_healthy}
      mock: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 5s
      timeout: 4s
      retries: 60
  api:
    build: .
    environment:
      GATEWAY_URL: http://gateway:4000
      APP_A_TOKEN: ${APP_A_TOKEN}
      APP_B_TOKEN: ${APP_B_TOKEN}
      APP_A_GATEWAY_KEY: ${APP_A_GATEWAY_KEY}
      APP_B_GATEWAY_KEY: ${APP_B_GATEWAY_KEY}
      METRICS_TOKEN: ${METRICS_TOKEN}
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      gateway: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 5s
      timeout: 3s
      retries: 20
  admin:
    build: .
    profiles: [admin]
    env_file: .env
    environment:
      GATEWAY_URL: http://gateway:4000
    command: [python, -m, scripts.bootstrap]
volumes:
  pgdata:
