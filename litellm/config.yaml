router_settings:
  num_retries: 1
  max_fallbacks: 1
  timeout: 30
  retry_after: 0
  disable_cooldowns: true
  fallbacks:
  - local:
    - reserve
  - fallback-demo:
    - fallback-reserve
  - failure-demo:
    - fail-reserve
  - timeout-demo:
    - timeout-reserve
  - ollama:
    - ollama-reserve
litellm_settings:
  set_verbose: false
  turn_off_message_logging: true
  callbacks:
  - safe_observability.observer
  redact_messages_in_exceptions: true
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_prompts_in_spend_logs: false
  disable_spend_logs: false
