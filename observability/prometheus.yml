global:
  scrape_interval: 5s
scrape_configs:
  - job_name: platform-api
    static_configs:
      - targets: [api:8000]
    authorization:
      credentials_file: /run/secrets/metrics_token
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: platform_.*
        action: keep
  - job_name: platform-gateway
    static_configs:
      - targets: [gateway:9091]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: gateway_.*
        action: keep
